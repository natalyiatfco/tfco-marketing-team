openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Digital Marketing Command Center API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: properties
    description: Brand property management
  - name: agents
    description: AI agent management
  - name: tasks
    description: Task management
  - name: reviews
    description: Review and approval workflow
  - name: dashboard
    description: Dashboard summary data
  - name: publish
    description: CMS publishing (WordPress / Squarespace)
  - name: ads
    description: Ad platform publishing (Google Ads / Meta Ads)
  - name: schedules
    description: Recurring task scheduler
  - name: analytics
    description: Platform analytics data
  - name: reports
    description: Generated report outputs from AI agents

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Properties (Brand Profiles)
  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List all brand properties
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Create a brand property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyBody"
      responses:
        "201":
          description: Created property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get a property by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found
    patch:
      operationId: updateProperty
      tags: [properties]
      summary: Update a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePropertyBody"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found
    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Delete a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Agents
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all AI agents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get an agent by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update an agent's system prompt and/or description
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentBody"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found

  # Tasks
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks with optional filters
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: propertyId
          in: query
          required: false
          schema:
            type: integer
        - name: agentId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create and run a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task with full details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "404":
          description: Not found

  /tasks/{id}/publish:
    post:
      operationId: publishTask
      tags: [publish]
      summary: Publish an approved task output to WordPress or Squarespace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishTaskBody"
      responses:
        "200":
          description: Publish result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResult"
        "400":
          description: Bad request
        "404":
          description: Not found
        "409":
          description: Task not in publishable state
        "422":
          description: CMS credentials not configured for this property

  /tasks/{id}/push-ads:
    post:
      operationId: pushTaskToAds
      tags: [ads]
      summary: Push an approved paid ad task output to Google Ads or Meta Ads
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushAdsBody"
      responses:
        "200":
          description: Push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushAdsResult"
        "400":
          description: Bad request
        "404":
          description: Not found
        "409":
          description: Task not in pushable state
        "422":
          description: Ad platform credentials not configured for this property

  # Analytics data
  /properties/{id}/analytics-data:
    get:
      operationId: getPropertyAnalyticsData
      tags: [analytics]
      summary: Fetch live analytics data from all connected platforms for a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: dateRange
          in: query
          required: false
          schema:
            type: string
            enum: [7days, 30days, 90days]
            default: 30days
      responses:
        "200":
          description: Aggregated analytics data from all connected platforms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsData"
        "404":
          description: Property not found

  /properties/{id}/analytics-data.pdf:
    get:
      operationId: downloadPropertyAnalyticsPdf
      tags: [analytics]
      summary: Download analytics data as PDF for a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: dateRange
          in: query
          required: false
          schema:
            type: string
            enum: [7days, 30days, 90days]
            default: 30days
      responses:
        "200":
          description: PDF file with analytics report
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Property not found

  /properties/{id}/analytics-data.csv:
    get:
      operationId: downloadPropertyAnalyticsCsv
      tags: [analytics]
      summary: Download analytics data as CSV for a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: dateRange
          in: query
          required: false
          schema:
            type: string
            enum: [7days, 30days, 90days]
            default: 30days
      responses:
        "200":
          description: CSV file with aggregated analytics data from all connected platforms
          content:
            text/csv:
              schema:
                type: string
        "404":
          description: Property not found

  # Reports
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List all generated reports (completed tasks with output)
      parameters:
        - name: propertyId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of report summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportSummary"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a specific report with full output
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report detail with full output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        "404":
          description: Report not found

  /reports/{id}/download.pdf:
    get:
      operationId: downloadReportPdf
      tags: [reports]
      summary: Download a report as PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF file of the report
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Report not found

  # Schedules
  /schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: List all recurring task schedules
      parameters:
        - name: propertyId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Create a new recurring task schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleBody"
      responses:
        "201":
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          description: Bad request

  /schedules/{id}:
    get:
      operationId: getSchedule
      tags: [schedules]
      summary: Get a schedule by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          description: Not found
    patch:
      operationId: updateSchedule
      tags: [schedules]
      summary: Update a schedule (edit or pause/resume)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleBody"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          description: Not found
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Delete a schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Reviews
  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List all reviews pending human approval
      parameters:
        - name: decision
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /reviews/{id}/decide:
    post:
      operationId: decideReview
      tags: [reviews]
      summary: Approve or reject a task output
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideReviewBody"
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: Not found

  # Dashboard
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary counts and stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent task activity feed
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Property:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        brandVoice:
          type: ["string", "null"]
        tone:
          type: ["string", "null"]
        targetAudience:
          type: ["string", "null"]
        primaryKeywords:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        instagramHandle:
          type: ["string", "null"]
        facebookHandle:
          type: ["string", "null"]
        twitterHandle:
          type: ["string", "null"]
        linkedinHandle:
          type: ["string", "null"]
        googleAdsCustomerId:
          type: ["string", "null"]
          description: "Google Ads customer/account ID (e.g. 123-456-7890) — read-only safe field"
        metaAdsAccountId:
          type: ["string", "null"]
          description: "Meta Ads account ID (e.g. act_123456789) — read-only safe field"
        metaAdPageId:
          type: ["string", "null"]
          description: "Meta (Facebook) Business Page ID used for ad creative creation"
        wordpressConfigured:
          type: boolean
        squarespaceConfigured:
          type: boolean
        googleAdsConfigured:
          type: boolean
          description: "True when both Google Ads customer ID and refresh token are stored"
        metaAdsConfigured:
          type: boolean
          description: "True when both Meta Ads account ID and access token are stored"
        openedAt:
          type: ["string", "null"]
          description: "Date the property opened (ISO 8601)"
        propertyType:
          type: ["string", "null"]
          description: "Category of the property, e.g. Restaurant, Wine Shop, Bar"
        logoUrl:
          type: ["string", "null"]
          description: "Base64 data URL or hosted URL for the property logo"
        resyUrl:
          type: ["string", "null"]
          description: "Resy reservation page URL for this property"
        hubspotPortalId:
          type: ["string", "null"]
          description: "HubSpot portal/account ID"
        hubspotConfigured:
          type: boolean
          description: "True when a HubSpot API key is stored"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - wordpressConfigured
        - squarespaceConfigured
        - googleAdsConfigured
        - metaAdsConfigured
        - hubspotConfigured
        - createdAt
        - updatedAt

    CreatePropertyBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        brandVoice:
          type: string
        tone:
          type: string
        targetAudience:
          type: string
        primaryKeywords:
          type: string
        websiteUrl:
          type: string
        instagramHandle:
          type: string
        facebookHandle:
          type: string
        twitterHandle:
          type: string
        linkedinHandle:
          type: string
        wordpressUrl:
          type: string
        wordpressUsername:
          type: string
        wordpressAppPassword:
          type: string
        squarespaceApiKey:
          type: string
        squarespaceCollectionId:
          type: string
        googleAdsCustomerId:
          type: string
          description: "Google Ads customer ID (digits only, e.g. 1234567890)"
        googleAdsRefreshToken:
          type: string
          description: "Google Ads OAuth2 refresh token — write-only, never returned"
        metaAdsAccountId:
          type: string
          description: "Meta Ads account ID without 'act_' prefix, e.g. 123456789"
        metaAdsAccessToken:
          type: string
          description: "Meta Ads access token — write-only, never returned"
        metaAdPageId:
          type: string
          description: "Facebook Business Page ID required for ad creative creation"
        openedAt:
          type: string
          description: "ISO 8601 date when the property opened"
        propertyType:
          type: string
          description: "Category of the property"
        logoUrl:
          type: string
          description: "Base64 data URL for the property logo"
        resyUrl:
          type: string
          description: "Resy reservation page URL"
        hubspotPortalId:
          type: string
          description: "HubSpot portal/account ID"
        hubspotApiKey:
          type: string
          description: "HubSpot private API key — write-only, never returned"
      required:
        - name

    UpdatePropertyBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        brandVoice:
          type: string
        tone:
          type: string
        targetAudience:
          type: string
        primaryKeywords:
          type: string
        websiteUrl:
          type: string
        instagramHandle:
          type: string
        facebookHandle:
          type: string
        twitterHandle:
          type: string
        linkedinHandle:
          type: string
        wordpressUrl:
          type: string
        wordpressUsername:
          type: string
        wordpressAppPassword:
          type: string
        squarespaceApiKey:
          type: string
        squarespaceCollectionId:
          type: string
        googleAdsCustomerId:
          type: string
        googleAdsRefreshToken:
          type: string
          description: "Write-only — leave blank to keep existing value"
        metaAdsAccountId:
          type: string
        metaAdsAccessToken:
          type: string
          description: "Write-only — leave blank to keep existing value"
        metaAdPageId:
          type: string
          description: "Facebook Business Page ID required for ad creative creation"
        openedAt:
          type: string
          description: "ISO 8601 date when the property opened"
        propertyType:
          type: string
          description: "Category of the property"
        logoUrl:
          type: string
          description: "Base64 data URL for the property logo"
        resyUrl:
          type: string
          description: "Resy reservation page URL"
        hubspotPortalId:
          type: string
          description: "HubSpot portal/account ID"
        hubspotApiKey:
          type: string
          description: "HubSpot private API key — write-only, leave blank to keep existing value"

    Agent:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        description:
          type: string
        systemPrompt:
          type: string
        color:
          type: string
        icon:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - role
        - description
        - systemPrompt
        - color
        - icon
        - createdAt

    UpdateAgentBody:
      type: object
      properties:
        systemPrompt:
          type: string
          description: "Updated system prompt for this agent"
        description:
          type: string
          description: "Updated short description for this agent"

    Task:
      type: object
      properties:
        id:
          type: integer
        agentId:
          type: integer
        agentName:
          type: string
        agentRole:
          type: string
        agentColor:
          type: string
        agentIcon:
          type: string
        propertyId:
          type: integer
        propertyName:
          type: string
        title:
          type: string
        inputPrompt:
          type: string
        output:
          type: ["string", "null"]
        status:
          type: string
        publishStatus:
          type: ["string", "null"]
        publishUrl:
          type: ["string", "null"]
        publishPlatform:
          type: ["string", "null"]
        publishedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - agentId
        - agentName
        - agentRole
        - agentColor
        - agentIcon
        - propertyId
        - propertyName
        - title
        - inputPrompt
        - status
        - createdAt
        - updatedAt

    TaskDetail:
      type: object
      properties:
        id:
          type: integer
        agentId:
          type: integer
        agentName:
          type: string
        agentRole:
          type: string
        agentColor:
          type: string
        agentIcon:
          type: string
        propertyId:
          type: integer
        propertyName:
          type: string
        title:
          type: string
        inputPrompt:
          type: string
        output:
          type: ["string", "null"]
        status:
          type: string
        publishStatus:
          type: ["string", "null"]
        publishUrl:
          type: ["string", "null"]
        publishPlatform:
          type: ["string", "null"]
        publishedAt:
          type: ["string", "null"]
        wordpressConfigured:
          type: boolean
        squarespaceConfigured:
          type: boolean
        googleAdsConfigured:
          type: boolean
        metaAdsConfigured:
          type: boolean
        googleAdsCustomerId:
          type: ["string", "null"]
        metaAdsAccountId:
          type: ["string", "null"]
        adPushStatus:
          type: ["string", "null"]
        adCampaignId:
          type: ["string", "null"]
        adPlatform:
          type: ["string", "null"]
        adPushedAt:
          type: ["string", "null"]
        review:
          oneOf:
            - $ref: "#/components/schemas/Review"
            - type: "null"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - agentId
        - agentName
        - agentRole
        - agentColor
        - agentIcon
        - propertyId
        - propertyName
        - title
        - inputPrompt
        - status
        - wordpressConfigured
        - squarespaceConfigured
        - googleAdsConfigured
        - metaAdsConfigured
        - createdAt
        - updatedAt

    CreateTaskBody:
      type: object
      properties:
        agentId:
          type: integer
        propertyId:
          type: integer
        title:
          type: string
        inputPrompt:
          type: string
      required:
        - agentId
        - propertyId
        - title
        - inputPrompt

    Review:
      type: object
      properties:
        id:
          type: integer
        taskId:
          type: integer
        taskTitle:
          type: ["string", "null"]
        taskOutput:
          type: ["string", "null"]
        taskInputPrompt:
          type: ["string", "null"]
        taskStatus:
          type: ["string", "null"]
        agentName:
          type: ["string", "null"]
        agentColor:
          type: ["string", "null"]
        agentIcon:
          type: ["string", "null"]
        propertyName:
          type: ["string", "null"]
        managerFeedback:
          type: ["string", "null"]
        managerScore:
          type: ["integer", "null"]
        decision:
          type: ["string", "null"]
        humanNotes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - taskId
        - createdAt
        - updatedAt

    DecideReviewBody:
      type: object
      properties:
        decision:
          type: string
        humanNotes:
